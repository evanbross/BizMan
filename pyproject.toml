[project]
name = "bizman"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    # Shared ZombieTech code (Caddy registration, SMTP, ...) from the sibling ../infra repo.
    "zt-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
norecursedirs = ["frontend", ".venv", "node_modules", "supabase"]
asyncio_mode = "auto"
# Both session-scoped, and matching each other: the async `engine` fixture in
# backend/tests/conftest.py is created once and reused across every test, so the test functions
# themselves must run on that same loop too - fixture and test loops default independently, and
# a fixture on the session loop with tests on the (default) per-function loop makes asyncpg's
# connection get used from two different loops, which fails opaquely mid-query.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["backend"]

[tool.uv.sources]
zt-common = { path = "../infra/zt-common", editable = true }
